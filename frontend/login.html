<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Sistema OCR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #1f5fa8;
      --primary-dark: #16447d;
      --bg: #f0f4f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7684;
      --border: #e2e8f0;
      --red: #d64545;
      --green: #1f9d55;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #16447d 0%, #1f5fa8 50%, #2d7dd2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
    }
    .brand h1 {
      color: white;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .brand p {
      color: rgba(255,255,255,0.75);
      font-size: 0.88rem;
    }
    .login-card {
      background: var(--card);
      border-radius: 20px;
      padding: 36px 36px 32px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    }
    .login-card h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .login-card .sub {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 7px;
    }
    .input-field {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: #fafbfc;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(31,95,168,0.18);
      background: white;
    }
    .btn-login {
      width: 100%;
      height: 48px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-login:hover { background: var(--primary-dark); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--red);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.87rem;
      margin-bottom: 16px;
      display: none;
    }
    .spinner-inline {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.65);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="brand">
      <div class="brand-icon">🪪</div>
      <h1>Sistema OCR</h1>
      <p>Verificación de Documentos de Identidad</p>
    </div>

    <div class="login-card">
      <h2>Iniciar sesión</h2>
      <p class="sub">Ingresa tus credenciales para continuar</p>

      <div class="error-box" id="error-box"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" class="input-field"
                 placeholder="Nombre de usuario" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" class="input-field"
                 placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-login" id="btn-submit">
          <span id="btn-text">Ingresar</span>
          <div class="spinner-inline" id="spinner"></div>
        </button>
      </form>
    </div>

    <p class="footer-note">Sistema OCR · Uso interno</p>
  </div>

  <script>
    // Si ya hay sesion activa, redirigir al inicio
    const token = localStorage.getItem("ocr_token");
    if (token) {
      // Validar que el token sea aun valido
      fetch("/api/auth/me", {
        headers: { "Authorization": `Bearer ${token}` }
      }).then(r => {
        if (r.ok) window.location.replace("/index.html");
      });
    }

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error-box");
    const btnSubmit = document.getElementById("btn-submit");
    const btnText = document.getElementById("btn-text");
    const spinner = document.getElementById("spinner");

    function setLoading(loading) {
      btnSubmit.disabled = loading;
      btnText.textContent = loading ? "Verificando..." : "Ingresar";
      spinner.style.display = loading ? "block" : "none";
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      setLoading(true);

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      try {
        const body = new URLSearchParams({ username, password });
        const resp = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString(),
        });

        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          throw new Error(data.detail || "Usuario o contraseña incorrectos.");
        }

        const data = await resp.json();
        localStorage.setItem("ocr_token", data.access_token);
        localStorage.setItem("ocr_user", JSON.stringify({
          username: data.username,
          nombre: data.nombre,
        }));

        window.location.replace("/index.html");
      } catch (err) {
        showError(err.message);
        setLoading(false);
      }
    });
  </script>
</body>
</html>
